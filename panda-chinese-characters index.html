<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Panda's Chinese Characters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Ma+Shan+Zheng&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF2E2;
    --paper-deep:#F3E6CC;
    --ink:#2E2A25;
    --ink-soft:#57503f;
    --seal:#E2562B;
    --seal-deep:#C43F1B;
    --bamboo:#5C9A6B;
    --bamboo-deep:#3E7A4C;
    --sky:#4E9BD6;
    --sun:#F0B32B;
    --lotus:#E97FA0;
    --card-shadow: 0 6px 0 rgba(46,42,37,0.18);
    --radius: 26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.4), transparent 45%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  #app{position:relative;min-height:100vh;display:flex;flex-direction:column;}
  .screen{display:none;flex:1;flex-direction:column;padding:18px 16px 30px;max-width:640px;margin:0 auto;width:100%;}
  .screen.active{display:flex;}

  h1,h2,h3{font-family:'Fredoka',sans-serif;margin:0;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .iconbtn{
    background:#fff;border:none;border-radius:16px;padding:10px 14px;
    box-shadow:var(--card-shadow); font-size:20px; cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:'Fredoka';font-weight:600;color:var(--ink-soft);
  }
  .iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(46,42,37,0.18);}
  .starcount{display:flex;align-items:center;gap:6px;background:#fff;padding:9px 14px;border-radius:16px;box-shadow:var(--card-shadow);font-family:'Fredoka';font-weight:600;}

  /* ---------- home ---------- */
  #screen-home{align-items:center;text-align:center;justify-content:center;gap:14px;}
  .brushtitle{font-family:'Ma Shan Zheng',cursive;font-size:70px;color:var(--seal);line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,0.06);}
  .home-title{font-size:32px;color:var(--ink);margin-top:6px;}
  .home-sub{color:var(--ink-soft);font-size:17px;max-width:420px;margin:4px auto 8px;font-weight:600;}
  .bigstart{
    background:var(--seal);color:#fff;border:none;border-radius:22px;
    font-family:'Fredoka';font-weight:600;font-size:24px;padding:18px 46px;
    box-shadow:0 8px 0 var(--seal-deep); cursor:pointer;margin-top:10px;
  }
  .bigstart:active{transform:translateY(6px);box-shadow:0 2px 0 var(--seal-deep);}
  .home-panda{width:180px;height:180px;margin-bottom:-6px;}

  /* ---------- level select ---------- */
  .level-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:10px;}
  .level-card{
    background:#fff;border-radius:var(--radius);padding:18px 20px;
    box-shadow:var(--card-shadow); display:flex;align-items:center;gap:16px;cursor:pointer;border:none;text-align:left;
  }
  .level-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(46,42,37,0.18);}
  .level-card.locked{opacity:0.55;cursor:not-allowed;}
  .level-badge{
    width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka';font-weight:700;font-size:24px;color:#fff;flex-shrink:0;
  }
  .level-info{flex:1;}
  .level-info h3{font-size:19px;}
  .level-info p{margin:2px 0 6px;color:var(--ink-soft);font-weight:700;font-size:14px;}
  .level-progress-track{background:var(--paper-deep);border-radius:10px;height:10px;overflow:hidden;}
  .level-progress-fill{height:100%;background:var(--bamboo);border-radius:10px;transition:width .4s ease;}
  .level-lock-icon{font-size:26px;}

  /* ---------- character grid ---------- */
  .char-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px;}
  @media(min-width:480px){.char-grid{grid-template-columns:repeat(3,1fr);}}
  .char-card{
    background:#fff;border:none;border-radius:20px;padding:14px 10px 12px;
    box-shadow:var(--card-shadow); text-align:center; cursor:pointer;position:relative;
  }
  .char-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(46,42,37,0.18);}
  .char-card .hanzi{font-family:'Ma Shan Zheng',cursive;font-size:46px;color:var(--ink);line-height:1;}
  .char-card .emoji{font-size:22px;}
  .char-card .pinyin{font-weight:800;color:var(--seal);font-size:14px;margin-top:2px;}
  .char-card .meaning{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .char-card .stars{position:absolute;top:6px;right:8px;font-size:13px;}

  /* ---------- trace screen ---------- */
  #screen-trace{align-items:center;}
  .trace-header{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:6px;}
  .trace-meta{text-align:center;margin-bottom:4px;}
  .trace-meta .pinyin-big{color:var(--seal);font-weight:800;font-size:20px;font-family:'Fredoka';}
  .trace-meta .meaning-big{color:var(--ink-soft);font-weight:700;font-size:15px;}
  .stroke-progress{display:flex;gap:6px;margin:8px 0 6px;flex-wrap:wrap;justify-content:center;}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--paper-deep);border:2px solid #fff;}
  .dot.done{background:var(--bamboo);}
  .dot.current{background:var(--sun);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}

  .canvas-wrap{
    position:relative;width:min(86vw,320px);height:min(86vw,320px);
    background:#fff; border-radius:24px; box-shadow:var(--card-shadow);
    touch-action:none; margin:6px auto 10px; overflow:hidden;
  }
  .canvas-wrap svg{width:100%;height:100%;display:block;}
  .grid-line{stroke:#EFE4CC;stroke-width:1;}

  .trace-controls{display:flex;gap:10px;justify-content:center;margin-top:4px;flex-wrap:wrap;}
  .ctrl-btn{
    background:#fff;border:none;border-radius:16px;padding:10px 18px;font-family:'Fredoka';font-weight:600;
    box-shadow:var(--card-shadow); cursor:pointer; font-size:15px; color:var(--ink-soft);display:flex;align-items:center;gap:6px;
  }
  .ctrl-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(46,42,37,0.18);}
  .ctrl-btn.primary{background:var(--bamboo);color:#fff;box-shadow:0 6px 0 var(--bamboo-deep);}
  .ctrl-btn.primary:active{box-shadow:0 2px 0 var(--bamboo-deep);}

  .feedback-msg{
    min-height:26px;font-family:'Fredoka';font-weight:600;color:var(--bamboo-deep);font-size:16px;margin-top:4px;text-align:center;
  }

  .panda-mascot{width:88px;height:88px;flex-shrink:0;transition:transform .25s ease;}
  .panda-mascot.happy{animation:bounce .5s ease;}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-14px) rotate(-6deg);}60%{transform:translateY(0) rotate(4deg);}}

  /* ---------- modal (level / trophy complete) ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(46,42,37,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal-card{
    background:var(--paper);border-radius:28px;padding:30px 26px;max-width:360px;width:100%;text-align:center;
    box-shadow:0 14px 0 rgba(46,42,37,0.18);
  }
  .modal-card h2{font-size:26px;color:var(--seal);margin-bottom:8px;}
  .modal-card p{color:var(--ink-soft);font-weight:700;margin:4px 0 18px;}
  .modal-stars{font-size:34px;letter-spacing:4px;margin:10px 0;}

  /* confetti */
  .confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:60;pointer-events:none;}

  footer.credit{text-align:center;color:var(--ink-soft);font-size:12px;font-weight:700;opacity:.55;margin-top:10px;}
</style>
</head>

<div id="app">

  <!-- HOME -->

    </div>

    <p style="text-align:center;color:var(--ink-soft);font-weight:700;margin:0 0 6px;">Earn stars to unlock the next garden!</p>
    <div class="level-grid" id="level-grid"></div>
  </section>

  <!-- CHARACTER GRID -->
  <section class="screen" id="screen-chars">
    <div class="topbar">
      <button class="iconbtn" id="btn-back-to-levels">← Levels</button>
      <div class="starcount" id="level-star-label">⭐ 0 / 10</div>
    </div>
    <h2 style="text-align:center;margin:6px 0 12px;" id="chars-title">Level 1</h2>
    <div class="char-grid" id="char-grid"></div>
  </section>

  <!-- TRACE SCREEN -->
  <section class="screen" id="screen-trace">
    <div class="trace-header">
      <button class="iconbtn" id="btn-back-to-chars">← Back</button>
      <svg class="panda-mascot" id="panda-trace" viewBox="0 0 200 200"></svg>

    <div class="trace-meta">

    </div>
    <div class="stroke-progress" id="stroke-dots"></div>
    <div class="canvas-wrap" id="canvas-wrap">
      <svg id="trace-svg" viewBox="0 0 300 300"></svg>
    </div>
    <div class="feedback-msg" id="feedback-msg">Watch the panda draw it first!</div>
    <div class="trace-controls">
      <button class="ctrl-btn" id="btn-watch">👀 Watch</button>
      <button class="ctrl-btn" id="btn-clear">🔄 Reset Stroke</button>
      <button class="ctrl-btn primary" id="btn-sound-trace">🔊 Sound</button>
    </div>
  </section>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" id="modal-card">
    <h2 id="modal-title">Great Job!</h2>
    <div class="modal-stars" id="modal-stars">⭐⭐⭐</div>
    <p id="modal-text">You finished this character!</p>
    <button class="ctrl-btn primary" id="modal-continue">Continue</button>
  </div>
</div>

============================================================ */
const state = {
  stars: {},          // char -> 1 (earned) 
  screen: 'home',
  currentLevel: 0,
  currentCharIdx: 0,  // index within CHARS for current char
  strokeIdx: 0,
  coverage: [],

  drawing: false,
  watching: false,
};

function charsForLevel(lvl){ return CHARS.filter(c=>c.lvl===lvl); }
function starsForLevel(lvl){
  return charsForLevel(lvl).reduce((s,c)=> s + (state.stars[c.c]?1:0), 0);
}

/* ============================================================
   3. AUDIO (Web Audio API - no external files)
============================================================ */
let actx = null;
function getCtx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function beep(freq, dur, type, vol, delay){
  if(!state.soundOn) return;
  try{
    const ctx = getCtx();
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
function sndStrokeGood(){ beep(720,0.18,'sine',0.18); }
function sndStrokeFail(){ beep(220,0.15,'sine',0.1); }
function sndCharComplete(){ beep(523,0.15,'triangle',0.18,0); beep(659,0.15,'triangle',0.18,0.12); beep(784,0.28,'triangle',0.2,0.24); }

/* ============================================================
   5. GEOMETRY HELPERS for tracing
============================================================ */
function polylineToPath(pts){
  return 'M ' + pts.map(p=>p[0]+','+p[1]).join(' L ');
}
// sample N points evenly along a polyline (arc-length based)
function sampleAlong(pts, n){
  const segLens=[]; let total=0;
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0], dy=pts[i+1][1]-pts[i][1];
    const L=Math.sqrt(dx*dx+dy*dy); segLens.push(L); total+=L;
  }
  const out=[];
  for(let k=0;k<n;k++){
    let target = total*k/(n-1);
    let i=0;
    while(i<segLens.length-1 && target>segLens[i]){ target-=segLens[i]; i++; }
    const L = segLens[i]||0.0001;
    const t = L? target/L : 0;
    const x = pts[i][0] + (pts[i+1][0]-pts[i][0])*t;
    const y = pts[i][1] + (pts[i+1][1]-pts[i][1])*t;
    out.push([x,y]);
  }
  return out;
}
function dist(a,b){ const dx=a[0]-b[0], dy=a[1]-b[1]; return Math.sqrt(dx*dx+dy*dy); }

/* ============================================================
   6. TRACE SCREEN LOGIC
============================================================ */
const SAMPLE_N = 26;
const TOLERANCE = 22;        // how close a point must be to count as "on" the guide
const STRAY_MAX = 55;        // beyond this, a point counts as a stray/off-path point
const ALLOWED_JUMP = 7;      // max forward jump (in sample indices) allowed per touch
const MIN_COVERAGE = 0.78;   // must cover this fraction of the stroke, in order
const MAX_STRAY_RATIO = 0.35;// fraction of points allowed to be off-path before failing
const MIN_TOUCH_POINTS = 6;  // ignore taps/very short scribbles
let sampledStroke = [];
let covered = [];
let userPts = [];
let lastMaxIndex = -1;
let strayPoints = 0;
let totalMovePoints = 0;
let strokeLenGuide = 0;

function polylineLength(pts){
  let L = 0;
  for(let i=0;i<pts.length-1;i++) L += dist(pts[i], pts[i+1]);
  return L;
}

function currentChar(){ return CHARS[state.currentCharIdx]; }

function loadCharacter(idx){
  state.currentCharIdx = idx;
  state.strokeIdx = 0;
  const ch = currentChar();
  document.getElementById('trace-pinyin').textContent = ch.p;
  document.getElementById('trace-meaning').innerHTML = ch.m + ' <span id="trace-emoji">'+ch.e+'</span>';
  renderStrokeDots();
  setupStroke();
  document.getElementById('feedback-msg').textContent = 'Trace the glowing line!';
}

function renderStrokeDots(){
  const ch = currentChar();
  const wrap = document.getElementById('stroke-dots');
  wrap.innerHTML = '';
  ch.strokes.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i<state.strokeIdx?' done':'') + (i===state.strokeIdx?' current':'');
    wrap.appendChild(d);
  });
}

function setupStroke(){
  const ch = currentChar();
  const svg = document.getElementById('trace-svg');
  svg.innerHTML = '';
  // grid guide lines
  svg.innerHTML += `<line class="grid-line" x1="150" y1="0" x2="150" y2="300"/><line class="grid-line" x1="0" y1="150" x2="300" y2="150"/>`;

  // completed strokes (solid ink)
  for(let i=0;i<state.strokeIdx;i++){
    svg.innerHTML += `<path d="${polylineToPath(ch.strokes[i])}" fill="none" stroke="#2E2A25" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // remaining strokes very faint
  for(let i=state.strokeIdx+1;i<ch.strokes.length;i++){
    svg.innerHTML += `<path d="${polylineToPath(ch.strokes[i])}" fill="none" stroke="#e7dcc4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>`;
  }
  // current stroke guide - dashed
  if(state.strokeIdx < ch.strokes.length){
    const pts = ch.strokes[state.strokeIdx];
    svg.innerHTML += `<path id="guide-path" d="${polylineToPath(pts)}" fill="none" stroke="#F0B32B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 14" opacity="0.9"/>`;
    // start marker
    svg.innerHTML += `<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="10" fill="#5C9A6B"/>`;
    svg.innerHTML += `<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="7" fill="none" stroke="#E2562B" stroke-width="3"/>`;
    sampledStroke = sampleAlong(pts, SAMPLE_N);
    covered = new Array(SAMPLE_N).fill(false);
    strokeLenGuide = polylineLength(pts);
    lastMaxIndex = -1;
    strayPoints = 0;
    totalMovePoints = 0;
  }
  // user drawn path (drawn live)
  svg.innerHTML += `<path id="user-path" d="" fill="none" stroke="#4E9BD6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
  userPts = [];
  renderStrokeDots();
}

function svgPoint(evt){
  const svg = document.getElementById('trace-svg');
  const rect = svg.getBoundingClientRect();
  const x = (evt.clientX - rect.left) / rect.width * 300;
  const y = (evt.clientY - rect.top) / rect.height * 300;
  return [x,y];
}

function onPointerDown(evt){
  if(state.watching) return;
  const ch = currentChar();
  if(state.strokeIdx >= ch.strokes.length) return;
  state.drawing = true;
  userPts = [svgPoint(evt)];
  updateUserPath();
  trackPoint(userPts[0]);
}
function onPointerMove(evt){
  if(!state.drawing) return;
  const p = svgPoint(evt);
  userPts.push(p);
  updateUserPath();
  trackPoint(p);
}
function onPointerUp(){
  if(!state.drawing) return;
  state.drawing = false;
  evaluateStroke();
}
function updateUserPath(){
  const el = document.getElementById('user-path');
  if(el) el.setAttribute('d', userPts.length? polylineToPath(userPts) : '');
}
// Finds the closest guide sample to p. Only marks it (and the gap back to the
// last covered point) as covered if it's within tolerance AND is a reasonable
// forward step from where the child has already traced — this is what stops
// scribbles, backwards tracing, or a stray touch near the end from "counting".
function trackPoint(p){
  totalMovePoints++;
  let bestIdx = -1, bestDist = Infinity;
  for(let i=0;i<sampledStroke.length;i++){
    const d = dist(p, sampledStroke[i]);
    if(d < bestDist){ bestDist = d; bestIdx = i; }
  }
  if(bestDist <= TOLERANCE){
    if(bestIdx <= lastMaxIndex + ALLOWED_JUMP){
      const from = Math.max(0, lastMaxIndex);
      for(let i=from;i<=bestIdx;i++) covered[i] = true;
      if(bestIdx > lastMaxIndex) lastMaxIndex = bestIdx;
    }
  } else if(bestDist > STRAY_MAX){
    strayPoints++;
  }
}
function evaluateStroke(){
  const total = covered.length;
  const doneCount = covered.filter(Boolean).length;
  const pct = doneCount/total;
  const startOk = covered[0] || covered[1];
  const endOk = lastMaxIndex >= total-2; // must have progressed to the end, in order
  const strayRatio = totalMovePoints ? strayPoints/totalMovePoints : 1;
  const drawnLen = polylineLength(userPts);
  const lengthOk = drawnLen >= strokeLenGuide * 0.5;
  const fb = document.getElementById('feedback-msg');
  const success = pct >= MIN_COVERAGE && startOk && endOk
    && strayRatio <= MAX_STRAY_RATIO && totalMovePoints >= MIN_TOUCH_POINTS && lengthOk;
  if(success){
    sndStrokeGood();
    fb.textContent = pickPraise();
    bouncePanda('happy');
    state.strokeIdx++;
    setTimeout(()=>{
      const ch = currentChar();
      if(state.strokeIdx >= ch.strokes.length){
        finishCharacter();
      } else {
        setupStroke();
        fb.textContent = 'Next stroke — trace the glowing line!';
      }
    }, 550);
  } else {
    sndStrokeFail();
    fb.textContent = !startOk ? 'Start at the green dot!'
      : !endOk ? 'Keep going all the way to the end!'
      : 'Try again — follow the dotted line!';
    userPts = [];
    updateUserPath();
    covered = new Array(SAMPLE_N).fill(false);
    lastMaxIndex = -1;
    strayPoints = 0;
    totalMovePoints = 0;
  }
}
const PRAISES = ['Awesome!','Great stroke!','Nicely done!','You got it!','Perfect!','Wonderful!'];
function pickPraise(){ return PRAISES[Math.floor(Math.random()*PRAISES.length)]; }

function finishCharacter(){
  const ch = currentChar();
  const firstTime = !state.stars[ch.c];
  state.stars[ch.c] = 1;
  sndCharComplete();
  bouncePanda('cheer');
  launchConfetti();
  document.getElementById('feedback-msg').textContent = 'You wrote ' + ch.c + '! 🎉';
  setTimeout(()=>{
    showCharCompleteModal(ch, firstTime);
  }, 700);
}

function watchStroke(){
  if(state.watching) return;
  const ch = currentChar();
  if(state.strokeIdx >= ch.strokes.length) return;
  state.watching = true;
  const svg = document.getElementById('trace-svg');
  const old = document.getElementById('demo-path');
  if(old) old.remove();
  const pts = ch.strokes[state.strokeIdx];
  const d = polylineToPath(pts);
  const demo = document.createElementNS('http://www.w3.org/2000/svg','path');
  demo.setAttribute('id','demo-path');
  demo.setAttribute('d', d);
  demo.setAttribute('fill','none');
  demo.setAttribute('stroke','#E2562B');
  demo.setAttribute('stroke-width','12');
  demo.setAttribute('stroke-linecap','round');
  demo.setAttribute('stroke-linejoin','round');
  svg.appendChild(demo);
  const len = demo.getTotalLength();
  demo.style.strokeDasharray = len;
  demo.style.strokeDashoffset = len;
  demo.getBoundingClientRect();
  demo.style.transition = 'stroke-dashoffset 0.9s ease';
  requestAnimationFrame(()=>{ demo.style.strokeDashoffset = 0; });
  setTimeout(()=>{
    demo.remove();
    state.watching = false;
  }, 1000);
}

function launchConfetti(){
  const colors = ['#E2562B','#5C9A6B','#4E9BD6','#F0B32B','#E97FA0'];
  for(let i=0;i<28;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.transform = 'rotate('+(Math.random()*360)+'deg)';
    document.body.appendChild(el);
    const duration = 1400 + Math.random()*900;
    el.animate([
      {transform:`translateY(0) rotate(0deg)`, opacity:1},
      {transform:`translateY(${window.innerHeight+40}px) rotate(${360+Math.random()*360}deg)`, opacity:0.9}
    ], {duration, easing:'ease-in'});
    setTimeout(()=>el.remove(), duration+50);
  }
}

function showCharCompleteModal(ch, firstTime){
  document.getElementById('modal-title').textContent = 'You wrote ' + ch.c + '!';
  document.getElementById('modal-stars').textContent = firstTime ? '⭐' : '⭐ (already earned)';
  document.getElementById('modal-text').textContent = ch.p + ' means "' + ch.m + '" ' + ch.e;
  document.getElementById('modal-continue').textContent = 'Continue';
  document.getElementById('modal-overlay').classList.add('active');
  document.getElementById('modal-continue').onclick = ()=>{
    document.getElementById('modal-overlay').classList.remove('active');
    checkLevelComplete();
  };
}
function checkLevelComplete(){
  const ch = currentChar();
  const lvl = ch.lvl;
  const levelChars = charsForLevel(lvl);
  const allDone = levelChars.every(c=>state.stars[c.c]);
  if(allDone && !state['celebrated'+lvl]){
    state['celebrated'+lvl] = true;
    setTimeout(()=>{
      sndLevelComplete();
      launchConfetti();
      document.getElementById('modal-title').textContent = 'Garden Complete! 🌸';
      document.getElementById('modal-stars').textContent = '⭐'.repeat(levelChars.length);
      document.getElementById('modal-text').textContent = LEVELS[lvl].name + ' finished! ' + (LEVELS[lvl+1] ? 'A new garden has opened!' : 'You learned all 50 characters!');
      document.getElementById('modal-continue').textContent = 'Yay!';
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById('modal-continue').onclick = ()=>{
        document.getElementById('modal-overlay').classList.remove('active');
        goToScreen('chars');
        renderCharsScreen();
      };
    }, 300);
  } else {
    goToScreen('chars');
    renderCharsScreen();
  }
}

/* ============================================================
   8. SCREEN RENDERING / NAV
============================================================ */
function goToScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  state.screen = name;
  window.scrollTo(0,0);
}

function renderLevelsScreen(){
  document.getElementById('total-stars').textContent = totalStars();
  const grid = document.getElementById('level-grid');
  grid.innerHTML = '';
  LEVELS.forEach((lvl, i)=>{
    const unlocked = levelUnlocked(i);
    const earned = starsForLevel(i);
    const card = document.createElement('button');
    card.className = 'level-card' + (unlocked? '' : ' locked');
    card.innerHTML = `
      <div class="level-badge" style="background:linear-gradient(135deg, ${lvl.grad[0]}, ${lvl.grad[1]});">${unlocked? (i+1) : '🔒'}</div>
      <div class="level-info">
        <h3>${lvl.name}</h3>
        <p>${earned} / 10 stars</p>
        <div class="level-progress-track"><div class="level-progress-fill" style="width:${earned*10}%; background:${lvl.grad[1]};"></div></div>
      </div>`;
    if(unlocked){
      card.onclick = ()=>{ sndClick(); state.currentLevel = i; goToScreen('chars'); renderCharsScreen(); };
    }
    grid.appendChild(card);
  });
}

function renderCharsScreen(){
  const lvl = state.currentLevel;
  document.getElementById('chars-title').textContent = LEVELS[lvl].name;
  const earned = starsForLevel(lvl);
  document.getElementById('level-star-label').textContent = '⭐ ' + earned + ' / 10';
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  charsForLevel(lvl).forEach((ch)=>{
    const idx = CHARS.indexOf(ch);
    const card = document.createElement('button');
    card.className = 'char-card';
    card.innerHTML = `
      ${state.stars[ch.c] ? '<div class="stars">⭐</div>' : ''}
      <div class="hanzi">${ch.c}</div>
      <div class="emoji">${ch.e}</div>
      <div class="pinyin">${ch.p}</div>
      <div class="meaning">${ch.m}</div>`;
    card.onclick = ()=>{ sndClick(); loadCharacter(idx); goToScreen('trace'); };
    grid.appendChild(card);
  });
}
